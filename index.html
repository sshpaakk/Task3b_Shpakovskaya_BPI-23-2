
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Справочник пользователей</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Справочник пользователей</h1>
        <p class="description">Загрузка пользователей и их публикаций через REST API</p>

        <div class="controls">
            <button id="loadBtn">Загрузить пользователей</button>

            <label for="searchInput">Поиск по имени</label>
            <input
                type="text"
                id="searchInput"
                placeholder="Введите имя пользователя"
            >
        </div>

        <p id="status"></p>

        <div class="content">
            <section class="users-section">
                <h2>Пользователи</h2>
                <div id="usersList"></div>
            </section>

            <section class="posts-section">
                <h2>Публикации пользователя</h2>
                <div id="postsList">
                    <p>Выберите пользователя для просмотра публикаций</p>
                </div>
            </section>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
